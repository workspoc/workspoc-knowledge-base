backend:
  name: github
  repo: workspoc/workspoc-knowledge-base
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

site_url: https://workspoc-kb.netlify.app
display_url: https://workspoc-kb.netlify.app
logo_url: https://workspoc-kb.netlify.app/img/workspoc-logo.webp

publish_mode: editorial_workflow
show_preview_links: true

media_folder: static/img/uploads
public_folder: /img/uploads

collections:
  - name: documentation
    label: Documentation
    label_singular: Article
    description: Edit and review existing workSPOC Voice Knowledge Base articles.
    folder: docs
    create: false
    delete: false
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [title]
    fields:
      - label: Article title
        name: title
        widget: string
      - label: Sidebar label
        name: sidebar_label
        widget: string
        required: false
        hint: Optional shorter title used in the left-side navigation.
      - label: Description
        name: description
        widget: text
        required: false
        hint: A short summary used by search engines and link previews.
      - label: Article content
        name: body
        widget: markdown
